# Optional override for kubeconfigs that work without a host-only auth plugin.
services:
  backend:
    environment:
      KUBECONFIG_PATH: /run/kube/config
    volumes:
      - type: bind
        source: ${KUBECONFIG_HOST_PATH:?Set KUBECONFIG_HOST_PATH to a kubeconfig file}
        target: /run/kube/config
        read_only: true
