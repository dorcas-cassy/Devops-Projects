apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-env
  namespace: ai-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: missing-env }
  template:
    metadata:
      labels: { app: missing-env }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'test -n "$DATABASE_URL" || { echo "DATABASE_URL missing" >&2; exit 1; }; sleep 3600'
