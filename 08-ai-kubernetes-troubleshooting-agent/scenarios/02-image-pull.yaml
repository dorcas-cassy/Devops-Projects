apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: ai-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-image }
  template:
    metadata:
      labels: { app: bad-image }
    spec:
      containers:
        - name: app
          image: nginx:tag-does-not-exist-ai-agent-test
