- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
- name: Create portfolio status page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
- name: Permit HTTP when UFW is installed
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: ansible_facts.packages.ufw is defined
  ignore_errors: true
