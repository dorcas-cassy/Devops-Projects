name: Build test and scan
on:
  push:
    branches: [main]
    paths: ['02-cicd-docker-app/**']
  pull_request:
    paths: ['02-cicd-docker-app/**']
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-cicd-docker-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: docker/build-push-action@v6
        with:
          context: ./02-cicd-docker-app
          push: false
          tags: portfolio-api:ci
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: portfolio-api:ci
          format: table
          exit-code: '0'
